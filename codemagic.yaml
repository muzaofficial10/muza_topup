workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Generate Android platform files
        script: |
          flutter create --platforms=android .
      - name: Add INTERNET permission
        script: |
          python3 -c "
          import re
          path = 'android/app/src/main/AndroidManifest.xml'
          content = open(path).read()
          if 'android.permission.INTERNET' not in content:
              content = content.replace('<manifest', '<manifest xmlns:tools=\"http://schemas.android.com/tools\"', 1) if False else content
              content = re.sub(r'(<manifest[^>]*>)', r'\1\n    <uses-permission android:name=\"android.permission.INTERNET\" />', content, count=1)
              open(path, 'w').write(content)
          "
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
